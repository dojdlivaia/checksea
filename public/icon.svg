<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0FB3C4"/>
      <stop offset="100%" stop-color="#0B3B5C"/>
    </linearGradient>
  </defs>
  <!-- Фон -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Пузыри -->
  <circle cx="380" cy="120" r="20" fill="rgba(255,255,255,0.2)"/>
  <circle cx="420" cy="80" r="12" fill="rgba(255,255,255,0.15)"/>
  <circle cx="100" cy="400" r="15" fill="rgba(255,255,255,0.15)"/>
  <circle cx="440" cy="380" r="18" fill="rgba(255,255,255,0.1)"/>
  <!-- Рыба-клоун -->
  <ellipse cx="256" cy="270" rx="100" ry="70" fill="#FF6B6B"/>
  <!-- Полоски -->
  <rect x="210" y="200" width="18" height="140" rx="9" fill="white"/>
  <rect x="280" y="200" width="18" height="140" rx="9" fill="white"/>
  <!-- Хвост -->
  <polygon points="356,270 420,220 420,320" fill="#FF6B6B"/>
  <!-- Плавник верх -->
  <ellipse cx="256" cy="200" rx="40" ry="25" fill="#FF8C8C"/>
  <!-- Глаз -->
  <circle cx="220" cy="255" r="18" fill="white"/>
  <circle cx="218" cy="255" r="10" fill="#0B3B5C"/>
  <circle cx="215" cy="252" r="4" fill="white"/>
  <!-- Рот (улыбка) -->
  <path d="M200,285 Q220,305 240,285" stroke="#0B3B5C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Текст -->
  <text x="256" y="430" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#FFD93D" text-anchor="middle">МАКАДИ</text>
</svg>
